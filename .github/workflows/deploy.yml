name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pygbag

      - name: Build WebAssembly distribution
        run: |
          python -m pygbag --build .

      - name: Prepare GitHub Pages artifact & disable Jekyll
        run: |
          # 1. Verify build/web exists and index.html was successfully generated
          if [ ! -d "build/web" ]; then
            echo "::error::Directory build/web does not exist!"
            exit 1
          fi

          if [ ! -f "build/web/index.html" ]; then
            echo "::error::build/web/index.html was not generated by Pygbag!"
            ls -la build/
            exit 1
          fi

          # 2. Explicitly create an empty .nojekyll file to bypass Jekyll on GitHub Pages
          touch build/web/.nojekyll

          # 3. Output artifact directory contents to verify index.html is at the root
          echo "=== Web distribution artifact contents ==="
          ls -la build/web/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
